[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "origin-mcp"
dynamic = ["version"]
description = "Local MCP server that lets AI assistants automate Origin/OriginPro for data import, worksheet editing, plotting, analysis, and export on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "origin-mcp contributors" }
]
keywords = ["mcp", "origin", "originpro", "plotting", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "mcp>=1.8.0",
  "pydantic>=2.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
origin = [
  "originpro>=1.1",
  "pywin32>=306; platform_system == 'Windows'",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.8",
]

[project.scripts]
origin-mcp = "origin_mcp.server:main"

[tool.hatch.version]
# Single source of truth: the version lives in src/origin_mcp/__init__.py
# (__version__), which the bridge reports over its ping handshake. Keeping it
# there avoids drift between the package metadata and the running bridge.
path = "src/origin_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/origin_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/origin_mcp/py.typed" = "origin_mcp/py.typed"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv*", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/origin_mcp"]
mypy_path = "src"
# The codebase was not previously type-checked. This is a deliberately lenient
# baseline: mypy catches signature/return/assignment regressions without
# requiring a full annotation pass. Tighten these over time.
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# OriginClient is assembled from cooperating mixins (_TablePlotMixin,
# _GraphStyleMixin, ...) that call across one another and into the dynamically
# typed originpro API. Checking each mixin in isolation produces false
# "has no attribute" positives, and the heavy originpro `Any` interaction makes
# precise return/argument typing low-value here. Relax this package as part of
# the lenient baseline; type enforcement focuses on the rest of the codebase.
module = "origin_mcp.client.*"
disable_error_code = [
  "attr-defined",
  "return-value",
  "arg-type",
  "assignment",
  "union-attr",
  "misc",
]

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv*",
  "__pycache__",
  "build",
  "dist",
  "output",
  "pytest-tmp",
  "pytest-tmp-*",
]
